<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Scanner</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { width: 360px; min-height: 420px; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
      .container { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .row { display: flex; gap: 8px; align-items: center; }
      button { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #111827; color: white; cursor: pointer; }
      button.secondary { background: white; color: #111827; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .video-wrap { position: relative; border-radius: 8px; overflow: hidden; background: #f3f4f6; }
      video { width: 100%; height: auto; }
      textarea { width: 100%; min-height: 80px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; resize: vertical; }
      .pill { font-size: 12px; padding: 2px 8px; border-radius: 9999px; border: 1px solid #e5e7eb; }
      .results { display: flex; flex-direction: column; gap: 8px; }
      .result-item { padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f9fafb; word-break: break-all; }
      input[type=file] { display: none; }
      label.file { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.jsx"></script>
  </body>
  </html>
